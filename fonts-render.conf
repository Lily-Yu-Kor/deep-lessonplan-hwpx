<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- 렌더 확인용: 한글 문서 글꼴을 박스에 있는 비슷한 고딕 글꼴로 대체 -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <alias binding="same"><family>맑은 고딕</family><prefer><family>NanumGothic</family></prefer></alias>
  <alias binding="same"><family>Malgun Gothic</family><prefer><family>NanumGothic</family></prefer></alias>
  <alias binding="same"><family>함초롬돋움</family><prefer><family>NanumGothic</family></prefer></alias>
  <alias binding="same"><family>함초롬바탕</family><prefer><family>NanumMyeongjo</family><family>Noto Serif CJK KR</family></prefer></alias>
</fontconfig>
